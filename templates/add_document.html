{% extends "main.html" %}

{% block content %}

<h2>Upload Employee Documents</h2>

<h3>
    Employee :
    {{ employee.employee_id }} -
    {{ employee.first_name }}
    {{ employee.last_name }}
</h3>

<br>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <div class="form-grid">

        <div class="form-group">
            <label>Aadhaar</label>
            <input type="file" name="aadhaar">
        </div>

        <div class="form-group">
            <label>PAN</label>
            <input type="file" name="pan">
        </div>

        <div class="form-group">
            <label>Passport</label>
            <input type="file" name="passport">
        </div>

        <div class="form-group">
            <label>Resume</label>
            <input type="file" name="resume">
        </div>

        <div class="form-group">
            <label>Profile Photo</label>
            <input type="file" name="profile_photo" accept="image/*">
        </div>

        <div class="form-group">
            <label>Certificates</label>
            <input
                type="file"
                name="certificate"
                multiple
                accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
            <small>
                Hold <b>Ctrl</b> (Windows) or <b>Cmd</b> (Mac) to select multiple certificates.
            </small>
        </div>

    </div>

    <br>

    <button type="submit" class="btn-save">
        Upload Documents
    </button>

    <a href="{% url 'employee_detail' employee.id %}">
        <button type="button" class="btn-back">
            Back
        </button>
    </a>

</form>

<style>

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    font-weight:bold;
    margin-bottom:6px;
}

input[type="file"]{
    margin-top:8px;
    padding:8px;
}

small{
    margin-top:6px;
    color:#666;
    font-size:13px;
}

.btn-save{
    background:#16a34a;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.btn-back{
    background:#2563eb;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-left:10px;
}

.btn-save:hover,
.btn-back:hover{
    opacity:.9;
}

</style>

{% endblock %}
