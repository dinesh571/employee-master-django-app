{% extends "main.html" %}

{% block content %}

<h2>Add Personal & Contact Details</h2>

<form method="POST">

    {% csrf_token %}

    <div class="form-grid">

        <div class="form-group">
            <label>Father Name</label>
            <input type="text" name="father_name" required>
        </div>

        <div class="form-group">
            <label>Mother Name</label>
            <input type="text" name="mother_name" required>
        </div>

        <div class="form-group">
            <label>Marital Status</label>

            <select name="marital_status" required>
                <option value="">Select</option>
                <option>Single</option>
                <option>Married</option>
                <option>Divorced</option>
            </select>

        </div>

        <div class="form-group">
            <label>Blood Group</label>

            <select name="blood_group" required>

                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>

            </select>

        </div>

        <div class="form-group">
            <label>Nationality</label>
            <input type="text" name="nationality" required>
        </div>

        <div class="form-group">
            <label>Personal Email</label>
            <input type="email" name="personal_email" required>
        </div>

        <div class="form-group">
            <label>Personal Mobile</label>
            <input type="text" name="personal_mobile" required>
        </div>

        <div class="form-group">
            <label>Emergency Contact Name</label>
            <input type="text" name="emergency_contact_name" required>
        </div>

        <div class="form-group">
            <label>Emergency Contact Number</label>
            <input type="text" name="emergency_contact_number" required>
        </div>

        <div class="form-group">
            <label>Relationship</label>
            <input type="text"
                   name="emergency_contact_relationship"
                   required>
        </div>

    </div>

    <br>

    <label>Permanent Address</label>

    <textarea
        name="permanent_address"
        rows="3"
        required></textarea>

    <br><br>

    <label>Current Address</label>

    <textarea
        name="current_address"
        rows="3"
        required></textarea>

    <br><br>

    <button type="submit" class="btn-save">
        Save Details
    </button>

    <a href="{% url 'personal_details_list' %}">
        <button type="button" class="btn-cancel">
            Cancel
        </button>
    </a>

</form>

<style>

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.form-group{
display:flex;
flex-direction:column;
}

label{
font-weight:bold;
margin-bottom:6px;
}

input,
select,
textarea{

width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;

}

textarea{

resize:vertical;

}

.btn-save{

background:#16a34a;
color:white;
padding:12px 20px;
border:none;
border-radius:6px;
cursor:pointer;

}

.btn-cancel{

background:#dc2626;
color:white;
padding:12px 20px;
border:none;
border-radius:6px;
cursor:pointer;
margin-left:10px;

}

@media(max-width:768px){

.form-grid{

grid-template-columns:1fr;

}

}

</style>

{% endblock %}
