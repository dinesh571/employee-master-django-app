{% extends "main.html" %}

{% block content %}

<h2>Edit Employee</h2>

<form method="POST">

    {% csrf_token %}

    <div class="form-grid">

        <div class="form-group">
            <label>Employee ID</label>
            <input type="text"
                   name="employee_id"
                   value="{{ employee.employee_id }}"
                   required>
        </div>

        <div class="form-group">
            <label>First Name</label>
            <input type="text"
                   name="first_name"
                   value="{{ employee.first_name }}"
                   required>
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text"
                   name="last_name"
                   value="{{ employee.last_name }}"
                   required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email"
                   name="email"
                   value="{{ employee.email }}"
                   required>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text"
                   name="phone"
                   value="{{ employee.phone }}"
                   required>
        </div>

        <div class="form-group">
            <label>Gender</label>

            <select name="gender">

                <option value="Male"
                {% if employee.gender == "Male" %}selected{% endif %}>
                    Male
                </option>

                <option value="Female"
                {% if employee.gender == "Female" %}selected{% endif %}>
                    Female
                </option>

                <option value="Other"
                {% if employee.gender == "Other" %}selected{% endif %}>
                    Other
                </option>

            </select>

        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date"
                   name="date_of_birth"
                   value="{{ employee.date_of_birth|date:'Y-m-d' }}"
                   required>
        </div>

        <div class="form-group">
            <label>Department</label>
            <input type="text"
                   name="department"
                   value="{{ employee.department }}"
                   required>
        </div>

        <div class="form-group">
            <label>Designation</label>
            <input type="text"
                   name="designation"
                   value="{{ employee.designation }}"
                   required>
        </div>

        <div class="form-group">
            <label>Joining Date</label>
            <input type="date"
                   name="joining_date"
                   value="{{ employee.joining_date|date:'Y-m-d' }}"
                   required>
        </div>

        <div class="form-group">
            <label>Status</label>

            <select name="status">

                <option value="Active"
                {% if employee.status == "Active" %}selected{% endif %}>
                    Active
                </option>

                <option value="Inactive"
                {% if employee.status == "Inactive" %}selected{% endif %}>
                    Inactive
                </option>

            </select>

        </div>

    </div>

    <br>

    <button type="submit" class="btn-update">
        Update Employee
    </button>

    <a href="{% url 'employee_detail' employee.id %}">
        <button type="button" class="btn-cancel">
            Cancel
        </button>
    </a>

</form>

<style>

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    font-weight:bold;
    margin-bottom:6px;
}

input,
select{
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

.btn-update{
    background:#2563eb;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.btn-cancel{
    background:#dc2626;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-left:10px;
}

@media(max-width:768px){

.form-grid{
    grid-template-columns:1fr;
}

}

</style>

{% endblock %}
