{% extends "main.html" %}

{% block content %}

<h2>Edit Personal & Contact Details</h2>

<form method="POST">

{% csrf_token %}

<div class="form-grid">

<div class="form-group">
<label>Father Name</label>
<input type="text"
name="father_name"
value="{{ detail.father_name }}"
required>
</div>

<div class="form-group">
<label>Mother Name</label>
<input type="text"
name="mother_name"
value="{{ detail.mother_name }}"
required>
</div>

<div class="form-group">

<label>Marital Status</label>

<select name="marital_status">

<option value="Single"
{% if detail.marital_status == "Single" %}selected{% endif %}>
Single
</option>

<option value="Married"
{% if detail.marital_status == "Married" %}selected{% endif %}>
Married
</option>

<option value="Divorced"
{% if detail.marital_status == "Divorced" %}selected{% endif %}>
Divorced
</option>

</select>

</div>

<div class="form-group">

<label>Blood Group</label>

<select name="blood_group" required>

    <option value="A+" {% if detail.blood_group == "A+" %}selected{% endif %}>A+</option>

    <option value="A-" {% if detail.blood_group == "A-" %}selected{% endif %}>A-</option>

    <option value="B+" {% if detail.blood_group == "B+" %}selected{% endif %}>B+</option>

    <option value="B-" {% if detail.blood_group == "B-" %}selected{% endif %}>B-</option>

    <option value="AB+" {% if detail.blood_group == "AB+" %}selected{% endif %}>AB+</option>

    <option value="AB-" {% if detail.blood_group == "AB-" %}selected{% endif %}>AB-</option>

    <option value="O+" {% if detail.blood_group == "O+" %}selected{% endif %}>O+</option>

    <option value="O-" {% if detail.blood_group == "O-" %}selected{% endif %}>O-</option>

</select>

</div>

<div class="form-group">
<label>Nationality</label>
<input type="text"
name="nationality"
value="{{ detail.nationality }}"
required>
</div>

<div class="form-group">
<label>Personal Email</label>
<input type="email"
name="personal_email"
value="{{ detail.personal_email }}"
required>
</div>

<div class="form-group">
<label>Personal Mobile</label>
<input type="text"
name="personal_mobile"
value="{{ detail.personal_mobile }}"
required>
</div>

<div class="form-group">
<label>Emergency Contact Name</label>
<input type="text"
name="emergency_contact_name"
value="{{ detail.emergency_contact_name }}"
required>
</div>

<div class="form-group">
<label>Emergency Contact Number</label>
<input type="text"
name="emergency_contact_number"
value="{{ detail.emergency_contact_number }}"
required>
</div>

<div class="form-group">
<label>Relationship</label>
<input type="text"
name="emergency_contact_relationship"
value="{{ detail.emergency_contact_relationship }}"
required>
</div>

</div>

<br>

<label>Permanent Address</label>

<textarea name="permanent_address" rows="3">{{ detail.permanent_address }}</textarea>

<br><br>

<label>Current Address</label>

<textarea name="current_address" rows="3">{{ detail.current_address }}</textarea>

<br><br>

<button type="submit" class="btn-update">
Update Details
</button>

<a href="{% url 'personal_details_list' %}">
<button type="button" class="btn-cancel">
Cancel
</button>
</a>

<style>

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.form-group{
display:flex;
flex-direction:column;
}

label{
font-weight:bold;
margin-bottom:6px;
}

input,
select,
textarea{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
}

.btn-update{
background:#2563eb;
color:white;
}

.btn-cancel{
background:#dc2626;
color:white;
margin-left:10px;
}

button{
padding:12px 20px;
border:none;
border-radius:6px;
cursor:pointer;
}

@media(max-width:768px){
.form-grid{
grid-template-columns:1fr;
}
}

</style>

{% endblock %}
