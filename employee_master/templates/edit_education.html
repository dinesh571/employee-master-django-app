{% extends "main.html" %}

{% block content %}

<h2>Edit Educational Qualification</h2>

<form method="POST">

{% csrf_token %}

<div class="form-grid">

<div class="form-group">
<label>Degree</label>
<input type="text" name="degree" value="{{ education.degree }}" required>
</div>

<div class="form-group">
<label>Specialization</label>
<input type="text" name="specialization" value="{{ education.specialization }}" required>
</div>

<div class="form-group">
<label>Institution</label>
<input type="text" name="institution" value="{{ education.institution }}" required>
</div>

<div class="form-group">
<label>University</label>
<input type="text" name="university" value="{{ education.university }}" required>
</div>

<div class="form-group">
<label>Year of Passing</label>
<input type="number" name="year_of_passing" value="{{ education.year_of_passing }}" required>
</div>

<div class="form-group">
<label>Percentage</label>
<input type="number" step="0.01" name="percentage" value="{{ education.percentage }}" required>
</div>

</div>

<br>

<button type="submit" class="btn-update">
Update Qualification
</button>

<a href="{% url 'education_list' %}">
<button type="button" class="btn-cancel">
Cancel
</button>
</a>

</form>

<style>

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.form-group{
display:flex;
flex-direction:column;
}

label{
font-weight:bold;
margin-bottom:6px;
}

input{
padding:10px;
border:1px solid #ccc;
border-radius:6px;
}

.btn-update{
background:#2563eb;
color:white;
padding:12px 20px;
border:none;
border-radius:6px;
cursor:pointer;
}

.btn-cancel{
background:#dc2626;
color:white;
padding:12px 20px;
border:none;
border-radius:6px;
cursor:pointer;
margin-left:10px;
}

</style>

{% endblock %}
