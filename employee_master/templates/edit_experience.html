{% extends "main.html" %}

{% block content %}

<h2>Edit Experience</h2>

<form method="POST">

{% csrf_token %}

<div class="form-grid">

<div class="form-group">
<label>Company Name</label>
<input type="text"
name="company_name"
value="{{ experience.company_name }}"
required>
</div>

<div class="form-group">
<label>Designation</label>
<input type="text"
name="designation"
value="{{ experience.designation }}"
required>
</div>

<div class="form-group">

<label>Employment Type</label>

<select name="employment_type">

<option value="Full Time" {% if experience.employment_type == "Full Time" %}selected{% endif %}>Full Time</option>

<option value="Part Time" {% if experience.employment_type == "Part Time" %}selected{% endif %}>Part Time</option>

<option value="Contract" {% if experience.employment_type == "Contract" %}selected{% endif %}>Contract</option>

<option value="Internship" {% if experience.employment_type == "Internship" %}selected{% endif %}>Internship</option>

<option value="Freelance" {% if experience.employment_type == "Freelance" %}selected{% endif %}>Freelance</option>

</select>

</div>

<div class="form-group">
<label>Start Date</label>
<input type="date"
name="start_date"
value="{{ experience.start_date|date:'Y-m-d' }}"
required>
</div>

<div class="form-group">
<label>End Date</label>
<input type="date"
name="end_date"
value="{{ experience.end_date|date:'Y-m-d' }}">
</div>

</div>

<br>

<label>

<input type="checkbox"
name="currently_working"
{% if experience.currently_working %}checked{% endif %}>

Currently Working

</label>

<br><br>

<label>Responsibilities</label>

<textarea
name="responsibilities"
rows="4">{{ experience.responsibilities }}</textarea>

<br><br>

<label>Skills Used</label>

<textarea
name="skills_used"
rows="3">{{ experience.skills_used }}</textarea>

<br><br>

<label>Reason For Leaving</label>

<textarea
name="reason_for_leaving"
rows="3">{{ experience.reason_for_leaving }}</textarea>

<br><br>

<button class="btn-update" type="submit">
Update Experience
</button>

<a href="{% url 'experience_list' %}">
<button class="btn-cancel" type="button">
Cancel
</button>
</a>

</form>

<style>

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.form-group{
display:flex;
flex-direction:column;
}

label{
font-weight:bold;
margin-bottom:6px;
}

input,
select,
textarea{
padding:10px;
border:1px solid #ccc;
border-radius:6px;
width:100%;
}

.btn-update{
background:#2563eb;
color:white;
padding:12px 20px;
border:none;
border-radius:6px;
cursor:pointer;
}

.btn-cancel{
background:#dc2626;
color:white;
padding:12px 20px;
border:none;
border-radius:6px;
cursor:pointer;
margin-left:10px;
}

</style>

{% endblock %}
